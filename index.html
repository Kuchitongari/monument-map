<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- アクセス解析(GA4。モニュメントnet 本体と同じプロパティ) -->

<title>モニュメントMAP - モニュメントnet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="モニュメントnet(memorial-object.jp)で紹介している各地のモニュメントを地図上に表示します。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html, body { margin: 0; height: 100%; font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
  #map { height: 100%; }
  .panel {
    background: rgba(255,255,255,.94); padding: 10px 12px; border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,.4); font-size: 13px; line-height: 1.9;
  }
  .panel h1 { font-size: 15px; margin: 0 0 4px; }
  /* 凡例の開閉(スマホでは最初たたんでおく。地図が隠れてしまうため) */
  .panel .head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .panel .head h1 { flex: 1; }
  .panel .toggle {
    border: 1px solid #bbb; background: #fff; border-radius: 4px; font-size: 12px;
    padding: 2px 8px; cursor: pointer; line-height: 1.6;
  }
  .panel.closed .body { display: none; }
  .panel.closed { padding: 6px 10px; }
  @media (max-width: 720px) {
    .panel { font-size: 12px; line-height: 1.7; max-width: 76vw; max-height: 58vh; overflow-y: auto; }
    .panel .site-link { font-size: 11px; }
  }
  .panel label { display: block; cursor: pointer; white-space: nowrap; }
  .panel .sw {
    display: inline-block; width: 12px; height: 12px; margin-right: 6px;
    border-radius: 50%; border: 1px solid #666; vertical-align: -1px;
  }
  .panel .cnt { color: #666; margin-left: 4px; }
  .panel .photo-box { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; }
  .panel .sw.pin-empty { background: #fff; border: 2px solid #888; }
  .popup .p-ask { margin-top: 6px; font-size: 11px; color: #a15c00; background: #fff6e5;
    border-radius: 4px; padding: 4px 6px; }
  .panel .site-link { font-size: 12px; margin-top: 6px; }
  .popup { width: 230px; }
  .popup img { width: 100%; border-radius: 4px; display: block; margin-bottom: 6px; }
  .popup .p-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .popup .p-addr { color: #444; font-size: 12px; }
  .popup .p-cats { color: #777; font-size: 11px; margin: 2px 0 4px; }
  /* 載っていないモニュメントを教える(情報提供フォームへ。表示中の地図の中心を持っていく) */
  .teach-btn {
    display: inline-block; padding: 8px 14px; border-radius: 999px; background: #333; color: #fff !important;
    font-size: 13px; font-weight: bold; text-decoration: none; box-shadow: 0 1px 5px rgba(0,0,0,.4);
  }
  @media (max-width: 720px) { .teach-btn { font-size: 12px; padding: 7px 12px; } }
  .popup a.p-link {
    display: inline-block; margin-top: 4px; padding: 4px 10px; background: #2b6cb0;
    color: #fff; border-radius: 4px; text-decoration: none; font-size: 12px;
  }
  /* タグでの絞り込み(?tag=鳥 / ?pref=東京都 / ?line=中央線 / ?cat=駅前) */
  .panel .filter-box { margin: 2px 0 6px; padding-bottom: 6px; border-bottom: 1px solid #ddd; }
  .panel .filter-box input[type=search] {
    width: 100%; box-sizing: border-box; font-size: 13px; padding: 4px 6px; border: 1px solid #bbb; border-radius: 4px;
  }
  .filterbar {
    background: rgba(255,255,255,.96); border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4);
    padding: 6px 8px; font-size: 13px; line-height: 1.6; max-width: 70vw;
  }
  .filterbar .chip {
    display: inline-block; margin: 2px 4px 2px 0; padding: 1px 4px 1px 10px; border-radius: 999px;
    background: #fdeee4; border: 1px solid #D9682B; white-space: nowrap;
  }
  .filterbar .chip button {
    border: 0; background: none; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; color: #8a3b10;
  }
  .filterbar .fcnt { color: #555; margin-left: 2px; }
  .filterbar .clear { border: 0; background: none; color: #2b6cb0; text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }
  @media (max-width: 720px) { .filterbar { font-size: 12px; } }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// 設置場所ベースのカテゴリー(台帳と同じ並び)。旧カテゴリー名は alias でまとめる
const CATEGORIES = [
  { name: "駅前",       color: "#E53935" },
  { name: "寺社境内",   color: "#D81B60", alias: ["神社仏閣"] },
  { name: "学校",       color: "#C0CA33" },
  { name: "霊園・墓地", color: "#5D4037" },
  { name: "公園",       color: "#43A047" },
  { name: "公共施設",   color: "#6D4C41" },
  { name: "広場・通り", color: "#FB8C00" },
  { name: "海浜",       color: "#00ACC1" },
  { name: "水辺",       color: "#039BE5" },
  { name: "山林・山道", color: "#2E7D32" },
  { name: "田園・農地", color: "#9E9D24" },
  { name: "商業地",     color: "#8E24AA", alias: ["商業施設"] },
  { name: "住宅地",     color: "#3949AB" },
  { name: "道路沿い",   color: "#546E7A" },
  { name: "その他",     color: "#757575" },
];
const COLOR = Object.fromEntries(CATEGORIES.map(c => [c.name, c.color]));

const map = L.map("map").setView([36.5, 138.5], 7);
// 記事の地図から来たとき(#ズーム/緯度/経度)は、その場所を開く
const hv = location.hash.match(/^#(\d{1,2})\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
if (hv) map.setView([+hv[2], +hv[3]], Math.min(Math.max(+hv[1], 5), 18));
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors | <a href="https://www.memorial-object.jp/" target="_blank">モニュメントnet</a>'
}).addTo(map);

const cluster = L.markerClusterGroup({ maxClusterRadius: 40 });
map.addLayer(cluster);

let monuments = [];
let wantedOnly = false;   // 「写真募集中だけ表示」
const enabled = new Set();      // 表示中カテゴリ
const counts = {};

// タグでの絞り込み。URL の ?tag=鳥&tag=東京都(すべてを含むものだけ)。?pref= ?muni= ?line= も同じ扱い
const params = new URLSearchParams(location.search);
const filterTags = [];
for (const key of ["tag", "pref", "muni", "line"]) {
  for (const v of params.getAll(key)) {
    for (const t of v.split(",")) if (t.trim() && !filterTags.includes(t.trim())) filterTags.push(t.trim());
  }
}
let onlyCat = params.get("cat");            // ?cat=駅前 は設置場所のカテゴリーで絞る
if (params.get("wanted") === "1") wantedOnly = true;
const BASE_TITLE = document.title;

function matchesFilter(m) {
  if (!filterTags.length) return true;
  const tags = m.tags || [];
  return filterTags.every(t => tags.includes(t));
}

// 絞り込みを URL に残す(共有・再読込で同じ表示になるように)
function syncUrl() {
  const q = new URLSearchParams();
  for (const t of filterTags) q.append("tag", t);
  if (onlyCat) q.set("cat", onlyCat);
  if (wantedOnly) q.set("wanted", "1");
  const s = q.toString();
  history.replaceState(null, "", location.pathname + (s ? "?" + s : "") + location.hash);
  document.title = filterTags.length ? `${filterTags.join("・")}のモニュメント - ${BASE_TITLE}` : BASE_TITLE;
}

// 代表カテゴリ(色分け用): CATEGORIES の並び順で最初に一致したもの
function primaryCat(cats) {
  for (const c of CATEGORIES) {
    if (cats.includes(c.name) || (c.alias || []).some(a => cats.includes(a))) return c.name;
  }
  return "その他";
}

// 色=カテゴリー、形=写真の有無。写真がない場合は白抜き+📷(色に頼らず区別できるようにする)
function pinIcon(color, hasPhoto) {
  const body = `<path d="M13 0C5.8 0 0 5.8 0 13c0 9.8 13 23 13 23s13-13.2 13-23C26 5.8 20.2 0 13 0z"
      fill="${hasPhoto ? color : "#fff"}" stroke="${hasPhoto ? "#333" : color}" stroke-width="${hasPhoto ? 1 : 2.5}"/>`;
  const inner = hasPhoto
    ? `<circle cx="13" cy="13" r="4.5" fill="#fff"/>`
    : `<text x="13" y="17.5" text-anchor="middle" font-size="11">📷</text>`;
  return L.divIcon({
    className: "", html: `<svg width="26" height="36" viewBox="0 0 26 36">${body}${inner}</svg>`,
    iconSize: [26, 36], iconAnchor: [13, 36], popupAnchor: [0, -34],
  });
}

// データの文字列は HTML として解釈させない(写真提供者の表示名など、外から入力された値が含まれるため)
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}
// リンク先は http(s) だけ(javascript: などは捨てる)
function safeUrl(u) {
  return /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#";
}

function popupHtml(m) {
  const url = safeUrl(m.url);
  return `<div class="popup">
    ${m.image ? `<a href="${url}" target="_blank"><img src="${safeUrl(m.image)}" alt="" loading="lazy"></a>` : ""}
    <div class="p-name">${esc(m.name)}</div>
    <div class="p-cats">${m.categories.map(esc).join(" / ")}</div>
    <div class="p-addr">${esc(m.address)}${m.access ? "<br>アクセス: " + esc(m.access) : ""}</div>
    <a class="p-link" href="${url}" target="_blank">記事を見る ≫</a>
    ${m.image ? "" : `<div class="p-ask">📷 写真がまだありません。<a href="${url === "#" ? "#" : url + "?photo=1#photo-form"}" target="_blank">記事のフォーム</a>からお寄せいただけます</div>`}
  </div>`;
}

// 表示している点。fit=true なら、その点がすべて入るように地図を動かす
function render(fit) {
  cluster.clearLayers();
  const shown = [];
  for (const m of monuments) {
    const cat = primaryCat(m.categories);
    if (!enabled.has(cat)) continue;
    const hasPhoto = !!m.image;
    if (wantedOnly && hasPhoto) continue;
    if (!matchesFilter(m)) continue;
    const mk = L.marker([m.lat, m.lng], { icon: pinIcon(COLOR[cat], hasPhoto), title: m.name });
    mk.bindPopup(popupHtml(m), { maxWidth: 260 });
    mk.on("popupopen", () => gtag("event", "map_popup", { monument_name: m.name, link_url: m.url, has_photo: hasPhoto }));
    cluster.addLayer(mk);
    shown.push([m.lat, m.lng]);
  }
  updateFilterBar(shown.length);
  if (fit && shown.length) {
    map.invalidateSize();     // 画面の大きさが読み込み中に変わっても、正しい縮尺で合わせる
    // 右上の凡例に点が隠れないよう、開いている凡例の幅だけ右をあける
    const panel = document.querySelector(".panel");
    const right = panel && !panel.classList.contains("closed") ? panel.offsetWidth + 30 : 40;
    map.fitBounds(shown, { paddingTopLeft: [40, 60], paddingBottomRight: [right, 40], maxZoom: 15 });
  }
}

// 絞り込み中だけ左上に出す帯(スマホで凡例をたたんでいても、何で絞っているかが分かるように)
const filterBar = L.control({ position: "topleft" });
let filterBarDiv = null;
filterBar.onAdd = () => {
  filterBarDiv = L.DomUtil.create("div", "filterbar");
  L.DomEvent.disableClickPropagation(filterBarDiv);
  L.DomEvent.disableScrollPropagation(filterBarDiv);
  return filterBarDiv;
};
function updateFilterBar(n) {
  if (!filterBarDiv) return;
  const parts = filterTags.map((t, i) =>
    `<span class="chip">${esc(t)}<button type="button" data-i="${i}" aria-label="${esc(t)}の絞り込みを外す">×</button></span>`);
  if (onlyCat) parts.push(`<span class="chip">${esc(onlyCat)}<button type="button" data-cat="1" aria-label="設置場所の絞り込みを外す">×</button></span>`);
  filterBarDiv.hidden = !parts.length;
  if (!parts.length) return;
  filterBarDiv.innerHTML = parts.join("") + `<span class="fcnt">${n}件</span> `
    + (parts.length > 1 ? `<button type="button" class="clear">すべて外す</button>` : "");
  filterBarDiv.querySelectorAll("button[data-i]").forEach(b => b.addEventListener("click", () => {
    filterTags.splice(+b.dataset.i, 1);
    syncUrl(); render(false);
  }));
  const catBtn = filterBarDiv.querySelector("button[data-cat]");
  if (catBtn) catBtn.addEventListener("click", () => {
    onlyCat = null;
    for (const c of Object.keys(counts)) enabled.add(c);
    document.querySelectorAll("input[data-cat]").forEach(cb => cb.checked = true);
    syncUrl(); render(false);
  });
  const clear = filterBarDiv.querySelector(".clear");
  if (clear) clear.addEventListener("click", () => { filterTags.length = 0; syncUrl(); render(false); });
}

function addFilterTag(t) {
  if (!t || filterTags.includes(t)) return;
  filterTags.push(t);
  gtag("event", "map_filter", { tag: t });
  syncUrl();
  render(true);
}

// 凡例 + カテゴリフィルタ
const legend = L.control({ position: "topright" });
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "panel");
  L.DomEvent.disableClickPropagation(div);
  let html = `<div class="head"><h1>モニュメントMAP</h1><button class="toggle" type="button">凡例</button></div><div class="body">
    <div class="filter-box"><input type="search" id="tag-input" list="tag-list" placeholder="地名・路線・種類で絞り込む"
      aria-label="タグで絞り込む" autocomplete="off"><datalist id="tag-list"></datalist></div>`;
  for (const c of CATEGORIES) {
    if (!counts[c.name]) continue;
    html += `<label><input type="checkbox" data-cat="${c.name}" ${enabled.has(c.name) ? "checked" : ""}>
      <span class="sw" style="background:${c.color}"></span>${c.name}<span class="cnt">(${counts[c.name]})</span></label>`;
  }
  html += `<div class="photo-box">
      <label><input type="checkbox" id="wanted-only">
        <span class="sw pin-empty"></span>📷 写真募集中だけ表示<span class="cnt">(<span id="wanted"></span>件)</span></label>
      <div class="cnt">写真あり <span id="withphoto"></span>件 / 掲載 <b><span id="total"></span></b> 件</div>
      <div class="cnt" id="contrib" hidden></div>
    </div>
    <div class="site-link"><a href="https://www.memorial-object.jp/" target="_blank">モニュメントnet</a><br>
      <span class="cnt">地図データ © OpenStreetMap contributors／掲載データは <a href="https://opendatacommons.org/licenses/odbl/1-0/" target="_blank">ODbL 1.0</a></span></div>
    </div>`;
  div.innerHTML = html;
  div.querySelectorAll("input[data-cat]").forEach(cb => cb.addEventListener("change", e => {
    e.target.checked ? enabled.add(e.target.dataset.cat) : enabled.delete(e.target.dataset.cat);
    render();
  }));
  // スマホでは最初たたんでおく(地図が隠れるため)。タイトルかボタンで開閉できる
  if (window.innerWidth <= 720) div.classList.add("closed");
  div.querySelector(".head").addEventListener("click", () => div.classList.toggle("closed"));
  const wo = div.querySelector("#wanted-only");
  wo.checked = wantedOnly;
  wo.addEventListener("change", e => {
    wantedOnly = e.target.checked;
    syncUrl();
    render();
  });
  // 候補は件数の多い順(地図に載っているタグだけ)。候補から選ぶか、正確な名前を入れて Enter で絞り込む
  const tagCount = {};
  for (const m of monuments) for (const t of (m.tags || [])) tagCount[t] = (tagCount[t] || 0) + 1;
  div.querySelector("#tag-list").innerHTML = Object.keys(tagCount)
    .sort((a, b) => tagCount[b] - tagCount[a] || a.localeCompare(b, "ja"))
    .map(t => `<option value="${esc(t)}" label="${tagCount[t]}件"></option>`).join("");
  const input = div.querySelector("#tag-input");
  const pick = () => {
    const v = input.value.trim();
    if (tagCount[v]) { addFilterTag(v); input.value = ""; }
  };
  input.addEventListener("change", pick);
  input.addEventListener("keydown", e => { if (e.key === "Enter") pick(); });
  return div;
};

// 「＋ 載っていないモニュメントを教える」: 押した時点の地図の中心・縮尺を持って情報提供のページを開く
// 固定ページ /teach/ を公開したので true(false にするとボタンが消える)
const TEACH_READY = true;
const TEACH_URL = "https://www.memorial-object.jp/teach/";
const teach = L.control({ position: "bottomleft" });
teach.onAdd = () => {
  const a = L.DomUtil.create("a", "teach-btn");
  a.href = TEACH_URL + "?src=map";
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "＋ 載っていないモニュメントを教える";
  L.DomEvent.disableClickPropagation(a);
  a.addEventListener("click", () => {
    const c = map.getCenter();
    a.href = `${TEACH_URL}?src=map&lat=${c.lat.toFixed(6)}&lng=${c.lng.toFixed(6)}&z=${map.getZoom()}`;
    gtag("event", "teach_open", { entry: "map" });
  });
  return a;
};
if (TEACH_READY) teach.addTo(map);

fetch("monuments.json").then(r => r.json()).then(data => {
  monuments = Array.isArray(data) ? data : data.items;   // 旧形式(配列)にも対応
  for (const m of monuments) {
    const cat = primaryCat(m.categories);
    counts[cat] = (counts[cat] || 0) + 1;
    enabled.add(cat);
  }
  if (onlyCat && counts[onlyCat]) {
    enabled.clear();
    enabled.add(onlyCat);
  } else {
    onlyCat = null;
  }
  legend.addTo(map);
  filterBar.addTo(map);
  const withPhoto = monuments.filter(m => m.image).length;
  document.getElementById("total").textContent = monuments.length;
  document.getElementById("withphoto").textContent = withPhoto;
  document.getElementById("wanted").textContent = monuments.length - withPhoto;
  // 写真提供の実績(pipeline/update_contributions.py が作る contributions.json より)
  const c = data.contributions;
  if (c && c.photos > 0) {
    const box = document.getElementById("contrib");
    box.hidden = false;
    box.innerHTML = `📸 これまで <b>${esc(c.people || 0)}</b> 人が <b>${esc(c.photos)}</b> 枚の写真を提供してくださいました`
      + (c.names && c.names.length ? `<br><span title="掲載を希望された方">${c.names.map(esc).join("、")} さん</span>` : "");
  }
  // 絞り込んで開いたときは、該当する点が入るように地図を動かす(記事の地図から #ズーム/緯度/経度 で来たときは動かさない)
  syncUrl();
  render(!hv && (filterTags.length > 0 || !!onlyCat));
  if (filterTags.length) gtag("event", "map_filter_open", { tag: filterTags.join(",") });
});
</script>
</body>
</html>
